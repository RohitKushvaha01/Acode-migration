import groovy.json.JsonSlurper

plugins {
    id 'com.android.application'
}

def acode = new JsonSlurper().parse(file('../../../package.json'))
def selectedEdition = ['com.foxdebug.acode': 'paid', 'com.foxdebug.acodefree': 'free'][acode.name]
if (!selectedEdition) throw new GradleException('Set package.json name to com.foxdebug.acode (paid) or com.foxdebug.acodefree (free).')
def fdroid = providers.gradleProperty('fdroid').orElse('false').get().toBoolean()

android {
    namespace = 'com.foxdebug.acode'
    compileSdk = 36
    buildToolsVersion = '36.0.0'
    defaultConfig {
        minSdk = 26
        targetSdk = fdroid ? 28 : 36
        versionCode = acode.versionCode
        versionName = acode.version
        buildConfigField 'boolean', 'FDROID', fdroid.toString()
    }
    flavorDimensions 'edition'
    productFlavors {
        paid { dimension = 'edition'; applicationId = 'com.foxdebug.acode' }
        free { dimension = 'edition'; applicationId = 'com.foxdebug.acodefree' }
    }
    buildFeatures { buildConfig = true; resValues = true }
    sourceSets {
        main {
            if (!fdroid) {
                java.srcDir 'src/store/java'
                assets.srcDir 'src/store/assets'
                jniLibs.srcDir 'src/store/jniLibs'
            }
        }
    }
    signingConfigs {
        release {}
        def configFile = file('../../../build.json')
        if (configFile.exists()) {
            def configurations = new JsonSlurper().parse(configFile).android
            ['debug', 'release'].each { type ->
                def config = configurations[type]
                if (config?.keystore) {
                    getByName(type) {
                        storeFile = new File(config.keystore).isAbsolute() ? file(config.keystore) : file('../../../' + config.keystore)
                        storePassword = config.storePassword
                        keyAlias = config.alias
                        keyPassword = config.password
                        if (config.keystoreType) storeType = config.keystoreType
                    }
                }
            }
        }
    }
    buildTypes {
        debug { debuggable = true }
        release {
            minifyEnabled = true
            shrinkResources = true
            if (signingConfigs.release.storeFile) signingConfig = signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    packaging {
        jniLibs { useLegacyPackaging = true }
        resources { pickFirsts += 'META-INF/versions/9/OSGI-INF/MANIFEST.MF' }
    }
    testOptions { unitTests.includeAndroidResources = true }
}

configurations.configureEach {
    exclude module: 'commons-logging'
    exclude group: 'org.bouncycastle', module: 'bcprov-jdk15on'
    exclude group: 'org.bouncycastle', module: 'bcpkix-jdk15on'
    exclude group: 'org.bouncycastle', module: 'bcpkix-jdk18on'
    exclude group: 'org.bouncycastle', module: 'bcprov-jdk18on'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
}
apply from: '../dependencies.gradle'

androidComponents {
    beforeVariants(selector().all()) { variant ->
        variant.enable = variant.productFlavors[0].second == selectedEdition
    }
}
